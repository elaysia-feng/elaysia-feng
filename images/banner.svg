<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Elias">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#1c1014"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e85d4c" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e85d4c"/>
      <stop offset="75%" stop-color="#f0a06a"/>
      <stop offset="100%" stop-color="#f0a06a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#dots)"/>
  <circle cx="1080" cy="-20" r="180" fill="#e85d4c" fill-opacity="0.12"/>
  <circle cx="80" cy="300" r="120" fill="#58a6ff" fill-opacity="0.07"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#line)"/>

  <text x="64" y="78" fill="#e85d4c" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="3">AGENT  ·  DISTRIBUTED SYSTEMS  ·  LOW LATENCY</text>
  <text x="64" y="148" fill="#f5f0ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700">Elias</text>
  <text x="64" y="190" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Building AI Agents and high-performance IM systems</text>

  <rect x="64" y="220" width="150" height="32" rx="8" fill="#e85d4c" fill-opacity="0.14" stroke="#e85d4c" stroke-opacity="0.45"/>
  <text x="139" y="241" text-anchor="middle" fill="#ffb4a8" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600">LangChain / Graph</text>

  <rect x="226" y="220" width="110" height="32" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.4"/>
  <text x="281" y="241" text-anchor="middle" fill="#9ecbff" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600">AI Agent</text>

  <rect x="348" y="220" width="140" height="32" rx="8" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.4"/>
  <text x="418" y="241" text-anchor="middle" fill="#7ee787" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600">Distributed IM</text>

  <rect x="500" y="220" width="140" height="32" rx="8" fill="#f5a623" fill-opacity="0.12" stroke="#f5a623" stroke-opacity="0.4"/>
  <text x="570" y="241" text-anchor="middle" fill="#ffd08a" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600">Epoll / IO_uring</text>
