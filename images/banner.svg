<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Elias — Field Agent File">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0710"/>
      <stop offset="55%" stop-color="#160d13"/>
      <stop offset="100%" stop-color="#1e1015"/>
    </linearGradient>
    <linearGradient id="topline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e8544a"/>
      <stop offset="75%" stop-color="#f0b45c"/>
      <stop offset="100%" stop-color="#f0b45c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brush" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8544a"/>
      <stop offset="100%" stop-color="#f0b45c"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8544a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8544a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="100%" height="6" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1" y="0" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
    <g id="petal">
      <ellipse cx="0" cy="-7" rx="5" ry="8" fill="#f7c8d0" fill-opacity="0.55"/>
      <ellipse cx="6.5" cy="-2" rx="5" ry="8" fill="#f7c8d0" fill-opacity="0.5" transform="rotate(72 6.5 -2)"/>
      <ellipse cx="4" cy="6" rx="5" ry="8" fill="#f7c8d0" fill-opacity="0.45" transform="rotate(144 4 6)"/>
      <ellipse cx="-4" cy="6" rx="5" ry="8" fill="#f7c8d0" fill-opacity="0.45" transform="rotate(216 -4 6)"/>
      <ellipse cx="-6.5" cy="-2" rx="5" ry="8" fill="#f7c8d0" fill-opacity="0.5" transform="rotate(288 -6.5 -2)"/>
      <circle cx="0" cy="0" r="2.2" fill="#f0b45c" fill-opacity="0.6"/>
    </g>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#scan)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#topline)"/>

  <use href="#petal" transform="translate(760,54) scale(1.1)"/>
  <use href="#petal" transform="translate(1120,90) scale(0.8) rotate(20)"/>
  <use href="#petal" transform="translate(120,270) scale(0.9) rotate(-15)"/>
  <use href="#petal" transform="translate(980,250) scale(0.7) rotate(40)"/>
  <use href="#petal" transform="translate(690,230) scale(0.55) rotate(-30)"/>

  <!-- left: identity block -->
  <text x="64" y="72" fill="#e8544a" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="4">FIELD AGENT FILE // BACKEND &amp; AI SYSTEMS</text>

  <text x="62" y="158" fill="#f6ecdf" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800">ELIAS</text>
  <path d="M64 178 Q 220 168, 400 179" stroke="url(#brush)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <text x="64" y="212" fill="#a99aa1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19">Agent &amp; Distributed Systems Developer</text>

  <g font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700">
    <rect x="64" y="238" width="150" height="30" rx="15" fill="#e8544a" fill-opacity="0.16" stroke="#e8544a" stroke-opacity="0.5"/>
    <rect x="80" y="249" width="8" height="8" fill="#f2a793" transform="rotate(45 84 253)"/>
    <text x="98" y="258" fill="#f2a793">LangChain/Graph</text>

    <rect x="222" y="238" width="112" height="30" rx="15" fill="#4c6fa5" fill-opacity="0.18" stroke="#6f93cf" stroke-opacity="0.5"/>
    <rect x="238" y="249" width="8" height="8" fill="#a9c2ea" transform="rotate(45 242 253)"/>
    <text x="256" y="258" fill="#a9c2ea">AI Agent</text>

    <rect x="342" y="238" width="140" height="30" rx="15" fill="#3f8f5f" fill-opacity="0.18" stroke="#59b57e" stroke-opacity="0.5"/>
    <rect x="358" y="249" width="8" height="8" fill="#9fe3ba" transform="rotate(45 362 253)"/>
    <text x="376" y="258" fill="#9fe3ba">Distributed IM</text>

    <rect x="490" y="238" width="150" height="30" rx="15" fill="#c98a3a" fill-opacity="0.18" stroke="#e0aa5c" stroke-opacity="0.5"/>
    <rect x="506" y="249" width="8" height="8" fill="#f2cf98" transform="rotate(45 510 253)"/>
    <text x="524" y="258" fill="#f2cf98">Epoll / IO_uring</text>
  </g>

  <!-- right: HUD emblem -->
  <g transform="translate(1010,160)">
    <circle r="92" fill="url(#ringGlow)"/>
    <circle r="78" fill="none" stroke="#f0b45c" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle r="66" fill="none" stroke="#e8544a" stroke-opacity="0.75" stroke-width="2"/>
    <circle r="66" fill="none" stroke="#e8544a" stroke-opacity="0.35" stroke-width="10"/>
    <g stroke="#f0b45c" stroke-width="2">
      <line x1="0" y1="-92" x2="0" y2="-82"/>
      <line x1="0" y1="92" x2="0" y2="82"/>
      <line x1="-92" y1="0" x2="-82" y2="0"/>
      <line x1="92" y1="0" x2="82" y2="0"/>
    </g>
    <circle r="4" fill="#f6ecdf"/>
    <text x="0" y="-2" text-anchor="middle" fill="#f6ecdf" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">AGENT</text>
    <text x="0" y="18" text-anchor="middle" fill="#c9bcb1" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">ID · 0721</text>
    <text x="0" y="-58" text-anchor="middle" fill="#7fce9c" font-family="Consolas, Menlo, monospace" font-size="10" letter-spacing="2">STATUS · ACTIVE</text>
  </g>
</svg>
