<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Elias - Agent Card">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1c0f16"/>
      <stop offset="100%" stop-color="#08060a"/>
    </radialGradient>

    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181019"/>
      <stop offset="100%" stop-color="#0c0810"/>
    </linearGradient>

    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b45c" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#f0b45c;#ff4d6d;#4ce0ff;#f0d38a;#f0b45c" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.35" stop-color="#e8544a" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#e8544a;#4ce0ff;#f0b45c;#ff4d6d;#e8544a" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.7" stop-color="#4ce0ff" stop-opacity="0.4">
        <animate attributeName="stop-color" values="#4ce0ff;#f0b45c;#ff4d6d;#4ce0ff;#4ce0ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f0d38a" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#f0d38a;#e8544a;#4ce0ff;#f0b45c;#f0d38a" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#fff6e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6e6" stop-opacity="0.65"/>
      <stop offset="0.54" stop-color="#fff6e6" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff6e6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="brush" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8544a"/>
      <stop offset="50%" stop-color="#f0b45c"/>
      <stop offset="100%" stop-color="#4ce0ff"/>
    </linearGradient>

    <linearGradient id="radar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ce0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4ce0ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scales" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M13 2 L24 13 L13 24 L2 13 Z" fill="none" stroke="#f0b45c" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="170" y="58" width="860" height="444" rx="22"/>
    </clipPath>

    <clipPath id="radarClip">
      <circle cx="1064" cy="90" r="26"/>
    </clipPath>

    <filter id="neonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#backdrop)"/>

  <!-- ambient twinkle particles -->
  <g fill="#f0d38a">
    <circle cx="96" cy="90" r="2.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="150" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="420" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="470" r="2.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="500" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating card -->
  <g clip-path="url(#cardClip)">
    <rect x="170" y="58" width="860" height="444" rx="22" fill="url(#cardBg)"/>
    <rect x="170" y="58" width="860" height="444" fill="url(#scales)"/>
    <rect x="170" y="58" width="860" height="444" fill="url(#foil)" opacity="0.4"/>

    <!-- circuit traces -->
    <g fill="none" stroke="#4ce0ff" stroke-opacity="0.28" stroke-width="1.2">
      <path id="trace1" d="M170 480 L340 480 L370 450 L620 450 L650 420 L860 420"/>
      <path id="trace2" d="M1030 80 L860 80 L830 110 L560 110 L530 140 L170 140"/>
    </g>
    <circle r="3.2" fill="#4ce0ff">
      <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#trace1" xlink:href="#trace1"/>
      </animateMotion>
    </circle>
    <circle r="3.2" fill="#ff8fa3">
      <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#trace2" xlink:href="#trace2"/>
      </animateMotion>
    </circle>

    <g transform="skewX(-18)">
      <rect x="-260" y="-40" width="140" height="620" fill="url(#sheen)">
        <animate attributeName="x" values="-260;1180;-260" dur="6s" keyTimes="0;0.75;1" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- animated energy border -->
  <rect x="170" y="58" width="860" height="444" rx="22" fill="none" stroke="#f0b45c" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="170" y="58" width="860" height="444" rx="22" fill="none" stroke="#ffe1a8" stroke-width="2" stroke-dasharray="40 900">
    <animate attributeName="stroke-dashoffset" values="0;-2608" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="180" y="68" width="840" height="424" rx="18" fill="none" stroke="#e8544a" stroke-opacity="0.4" stroke-width="1"/>

  <!-- corner brackets -->
  <g stroke="#f0d38a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M182 96 L182 72 L206 72"/>
    <path d="M1018 96 L1018 72 L994 72"/>
    <path d="M182 464 L182 488 L206 488"/>
    <path d="M1018 464 L1018 488 L994 488"/>
  </g>

  <!-- radar emblem -->
  <g transform="translate(1064,90)">
    <circle r="26" fill="#0c0810" stroke="#4ce0ff" stroke-opacity="0.5" stroke-width="1"/>
    <circle r="18" fill="none" stroke="#4ce0ff" stroke-opacity="0.35" stroke-width="1"/>
    <g clip-path="url(#radarClip)">
      <path d="M1064 90 L1064 64 A26 26 0 0 1 1090 90 Z" fill="url(#radar)">
        <animateTransform attributeName="transform" type="rotate" from="0 1064 90" to="360 1064 90" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle r="2.4" fill="#4ce0ff"/>
  </g>

  <!-- top register -->
  <text x="206" y="102" fill="#f0b45c" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="3">FIELD AGENT FILE</text>
  <text x="1030" y="102" text-anchor="end" fill="#7fce9c" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2">SIGNAL - 99%</text>

  <!-- rarity -->
  <g transform="translate(994,124)" text-anchor="end">
    <text fill="#f0d38a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" filter="url(#softGlow)">
      SSR *****
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- monogram watermark -->
  <text x="242" y="330" fill="#f6ecdf" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="220" font-weight="700" opacity="0.06">E</text>

  <!-- name with neon glow -->
  <text x="206" y="222" fill="#e8544a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="1" filter="url(#neonGlow)" opacity="0.55">ELIAS</text>
  <text x="206" y="222" fill="#f6ecdf" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="1">ELIAS</text>
  <path d="M208 240 Q 340 230, 470 241" stroke="url(#brush)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="206" y="266" fill="#b7a6ac" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="2">AGENT - BACKEND AND DISTRIBUTED SYSTEMS</text>

  <!-- stat highlight with glow -->
  <g transform="translate(206,300)" filter="url(#softGlow)">
    <text fill="#f0b45c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">&lt;10ms</text>
    <text x="240" y="0" fill="#4ce0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">10K+</text>
  </g>
  <g transform="translate(206,300)">
    <text x="112" y="0" fill="#8b7d82" font-family="Consolas, Menlo, monospace" font-size="12">E2E LATENCY</text>
    <text x="322" y="0" fill="#8b7d82" font-family="Consolas, Menlo, monospace" font-size="12">CONNECTIONS</text>
  </g>

  <!-- divider -->
  <line x1="206" y1="330" x2="994" y2="330" stroke="#f0b45c" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ability rows -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- row 1 -->
    <g transform="translate(206,352)">
      <path d="M0 -10 L7 -10 L2 0 L9 0 L-2 16 L1 2 L-6 2 Z" fill="#f0b45c"/>
      <text x="20" y="0" fill="#f6ecdf" font-size="15" font-weight="700">Kernel I/O Tuning</text>
      <text x="920" y="0" text-anchor="end" fill="#f0b45c" font-size="15" font-weight="800">92</text>
      <rect x="20" y="6" width="120" height="4" rx="2" fill="#3a2f33"/>
      <rect x="20" y="6" width="110" height="4" rx="2" fill="#f0b45c"/>
      <text x="150" y="20" fill="#8b7d82" font-family="Consolas, Menlo, monospace" font-size="11">Epoll / IO_uring / zero-copy buffers</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(206,398)">
      <circle cx="3" cy="-4" r="4" fill="#4ce0ff"/>
      <circle cx="-6" cy="6" r="3.5" fill="#4ce0ff"/>
      <circle cx="12" cy="6" r="3.5" fill="#4ce0ff"/>
      <path d="M3 -4 L-6 6 M3 -4 L12 6" stroke="#4ce0ff" stroke-width="1.4"/>
      <text x="20" y="0" fill="#f6ecdf" font-size="15" font-weight="700">Multi-Agent Orchestration</text>
      <text x="920" y="0" text-anchor="end" fill="#4ce0ff" font-size="15" font-weight="800">88</text>
      <rect x="20" y="6" width="120" height="4" rx="2" fill="#3a2f33"/>
      <rect x="20" y="6" width="106" height="4" rx="2" fill="#4ce0ff"/>
      <text x="150" y="20" fill="#8b7d82" font-family="Consolas, Menlo, monospace" font-size="11">LangChain / LangGraph / tool use</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(206,444)">
      <path d="M3 -10 L11 -6 L11 2 C11 10 3 16 3 16 C3 16 -5 10 -5 2 L-5 -6 Z" fill="#7ee787"/>
      <text x="20" y="0" fill="#f6ecdf" font-size="15" font-weight="700">Systems Resilience</text>
      <text x="920" y="0" text-anchor="end" fill="#7ee787" font-size="15" font-weight="800">90</text>
      <rect x="20" y="6" width="120" height="4" rx="2" fill="#3a2f33"/>
      <rect x="20" y="6" width="108" height="4" rx="2" fill="#7ee787"/>
      <text x="150" y="20" fill="#8b7d82" font-family="Consolas, Menlo, monospace" font-size="11">Canary release / circuit breaking / self-healing</text>
    </g>
  </g>

  <!-- terminal status line -->
  <g transform="translate(206,486)" font-family="Consolas, Menlo, monospace" font-size="11">
    <text fill="#7ee787">&gt; STATUS: AGENT_ONLINE</text>
    <rect x="152" y="-9" width="7" height="12" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="994" y="486" text-anchor="end" fill="#6b5f63" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">JAVA / PYTHON / C++</text>
</svg>
