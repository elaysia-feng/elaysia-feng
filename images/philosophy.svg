<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="Engineering Philosophy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
  </defs>
  <rect width="860" height="280" rx="16" fill="url(#bg)" stroke="#30363d"/>

  <!-- Card 1 -->
  <rect x="20" y="20" width="400" height="110" rx="12" fill="#161b22" stroke="#238636" stroke-opacity="0.45"/>
  <text x="40" y="52" fill="#3fb950" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Metrics-Driven</text>
  <text x="40" y="82" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Benchmark ’ Profile ’ Optimize.</text>
  <text x="40" y="104" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Data first, decisions second.</text>

  <!-- Card 2 -->
  <rect x="440" y="20" width="400" height="110" rx="12" fill="#161b22" stroke="#388bfd" stroke-opacity="0.45"/>
  <text x="460" y="52" fill="#58a6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Clear Boundaries</text>
  <text x="460" y="82" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Interfaces and contracts constrain complexity.</text>
  <text x="460" y="104" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">No shared mutable state.</text>

  <!-- Card 3 -->
  <rect x="20" y="150" width="400" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-opacity="0.45"/>
  <text x="40" y="182" fill="#f5a623" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Observability First</text>
  <text x="40" y="212" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Logs / Metrics / Trace from day one.</text>
  <text x="40" y="234" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Default-on observability.</text>

  <!-- Card 4 -->
  <rect x="440" y="150" width="400" height="110" rx="12" fill="#161b22" stroke="#e85d4c" stroke-opacity="0.45"/>
  <text x="460" y="182" fill="#e85d4c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Code Hygiene</text>
  <text x="460" y="212" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">RAII · Strong types · Few raw pointers.</text>
  <text x="460" y="234" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Testability first.</text>
</svg>
