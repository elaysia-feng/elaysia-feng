<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="NebulaChat">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#16111a"/>
    </linearGradient>
  </defs>
  <rect width="860" height="210" rx="16" fill="url(#card)" stroke="#30363d"/>
  <rect x="0" y="0" width="6" height="210" rx="3" fill="#e85d4c"/>
  <text x="36" y="48" fill="#e85d4c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">FEATURED PROJECT</text>
  <text x="36" y="88" fill="#f0f3f6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">NebulaChat</text>
  <text x="230" y="88" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">· Distributed IM Platform</text>
  <text x="36" y="126" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Epoll + Reactor · 10k+ persistent connections · e2e latency &lt; 10ms</text>
  <text x="36" y="152" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">MySQL + Redis + Protobuf · monitoring &amp; stress-test pipeline · second-level scaling</text>

  <rect x="36" y="172" width="58" height="22" rx="5" fill="#58a6ff" fill-opacity="0.15"/>
  <text x="65" y="187" text-anchor="middle" fill="#58a6ff" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">C++17</text>
  <rect x="102" y="172" width="58" height="22" rx="5" fill="#3fb950" fill-opacity="0.15"/>
  <text x="131" y="187" text-anchor="middle" fill="#3fb950" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">Epoll</text>
  <rect x="168" y="172" width="58" height="22" rx="5" fill="#f5a623" fill-opacity="0.15"/>
  <text x="197" y="187" text-anchor="middle" fill="#f5a623" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">MySQL</text>
  <rect x="234" y="172" width="58" height="22" rx="5" fill="#fb7185" fill-opacity="0.15"/>
  <text x="263" y="187" text-anchor="middle" fill="#fb7185" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">Redis</text>
  <rect x="300" y="172" width="72" height="22" rx="5" fill="#e85d4c" fill-opacity="0.15"/>
  <text x="336" y="187" text-anchor="middle" fill="#e85d4c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">Protobuf</text>
  <rect x="380" y="172" width="50" height="22" rx="5" fill="#58a6ff" fill-opacity="0.15"/>
  <text x="405" y="187" text-anchor="middle" fill="#58a6ff" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">gRPC</text>
